query PublicPack($input:PackInput!) {
  publicPack(input:$input) {
    pack {
      ...Pack

      comments {
        ...Comment

        user {
          ...BaseUser
        }

        replies {
          ...Reply

          user {
            ...BaseUser
          }
        }
      }
    }
    user {
      ...BaseUser
    }
    errors {
      ...BaseError
    }
  }
}